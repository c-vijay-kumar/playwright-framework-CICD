trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

schedules:
  - cron: "30 20 * * *"        # nightly, 02:00 IST
    displayName: Nightly regression
    branches:
      include:
        - main
    always: true

parameters:
  - name: env
    displayName: Environment
    type: string
    default: qa
    values: [qa, dev, staging]
  - name: browser
    displayName: Browser
    type: string
    default: chromium
    values: [chromium, firefox, webkit]
  - name: groups
    displayName: TestNG group
    type: string
    default: smoke
    values: [smoke, regression]

pool:
  vmImage: ubuntu-latest

steps:
  - task: JavaToolInstaller@0
    displayName: Set up Java 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: >
      mvn -B exec:java -e
      -D exec.mainClass=com.microsoft.playwright.CLI
      -D exec.args="install --with-deps"
    displayName: Install Playwright browsers

  - script: >
      mvn -B clean test
      -Denv=${{ parameters.env }}
      -Dbrowser=${{ parameters.browser }}
      -Dgroups=${{ parameters.groups }}
      -Dheadless=true
    displayName: Run tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'target/surefire-reports/TEST-*.xml'
      failTaskOnFailedTests: true

  - task: PublishPipelineArtifact@1
    displayName: Upload reports
    condition: always()
    inputs:
      targetPath: target
      artifact: test-reports